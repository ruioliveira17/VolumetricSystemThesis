<!doctype html>

    <title translate="no">Qubic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;

      #boot-curtain {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #0a0a0a url('/qubic_background.jpg') center/cover no-repeat;

        transition: opacity 0.35s ease;
      }

      #boot-curtain.off {
        opacity: 0;
        pointer-events: none;
      }
