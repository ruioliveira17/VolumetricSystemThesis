    <!-- The 4 corner-lines: path starts mid-top-edge (never at a vertex) so no dash boundary ever
         crosses a corner — every corner keeps its clean mitered right angle throughout the loop.
         At rest (t=0 and t=1) this renders pixel-identical to the original 4 corner brackets. -->
    <path class="loader-frame"
          d="M75,2.2 H147.8 V51.8 H2.2 V2.2 Z"
          stroke-dasharray="22 27.6 22 123.6 22 27.6 22 123.6"
          stroke-dashoffset="-61.8">

      <!-- Ease-in/ease-out rotation: one complete clockwise lap, landing back exactly
           on the starting offset (perimeter length added is exactly one full loop). -->
      <animate attributeName="stroke-dashoffset"
        dur="3.6s" repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;1"
        keySplines="0.65 0 0.35 1"
        values="-61.8;-452.2"/>

      <!-- The 4 lines lengthen and become evenly spaced mid-lap, then contract back
           to the original corner size at the exact moment the lap completes. -->
      <animate attributeName="stroke-dasharray"
        dur="3.6s" repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.5;1"
        keySplines="0.65 0 0.35 1;0.65 0 0.35 1"
        values="22 27.6 22 123.6 22 27.6 22 123.6;
                32 65.6 32 65.6 32 65.6 32 65.6;
                22 27.6 22 123.6 22 27.6 22 123.6"/>
    </path>

